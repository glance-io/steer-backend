services:
  # Main FastAPI application service
  web:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "80"]
    depends_on:
      - redis
    env_file:
      - .env
    environment:
        - REDIS_HOST=redis
        - REDIS_PORT=6379
    networks:
      - steer

  # Nginx reverse proxy for SSL termination and request routing
  nginx:
    image: nginx:1.30.7-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/:/etc/nginx/certs/
    ports:
      - 80:80
      - 443:443
    depends_on:
      - web
    networks:
      - steer
      - electron-updater

  # Redis for caching and message broker
  redis:
    image: "redis:alpine"
    networks:
      - steer

networks:
  # Internal network for backend services
  steer:
    driver: bridge
  # External network for electron app updates
  electron-updater:
    name: electron-release-server_electron-updater
    external: true

